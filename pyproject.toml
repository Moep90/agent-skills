[project]
name = "agent-skills"
version = "0.0.0" # not a package; plugins are versioned in scripts/sync_plugins.py
description = "Tests and tooling for the agent-skills marketplace."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
required-version = ">=0.11"

[tool.ruff]
line-length = 100
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "PT", "RUF"] # S = bandit security rules

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"] # asserts and fixed CLI calls are expected in tests

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "plugin_cli: drives a real client CLI (claude/codex) to validate the marketplace",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.10",
]
